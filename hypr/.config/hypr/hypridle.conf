# hypridle is a separate program and still uses hyprlang, not Lua.
# Note the dispatch syntax: Hyprland 0.55+ takes Lua, so the legacy
# `hyprctl dispatch dpms off` found in most guides fails with
# "')' expected near 'off'". Use hl.dsp.* instead.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 min -> lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min -> display off
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
